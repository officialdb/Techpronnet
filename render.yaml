services:
  - type: web
    name: techpronnet-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: techpronnet-db
          property: connectionString
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: ALLOWED_ORIGINS
        value: http://localhost:3000,https://techpronnet.vercel.app,https://techpronnet.com

databases:
  - name: techpronnet-db
    databaseName: techpronnet_db
    user: techpronnet_user
    plan: free
